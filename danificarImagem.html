<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>OCR - Degradação Real</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    img {
      max-width: 100%;
    }

    button {
      margin-top: 8px;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Teste OCR - Degradação REAL</h2>
<input type="file" id="upload" accept="image/*">

<div class="container" id="previewContainer"></div>

<script>
const uploadInput = document.getElementById('upload');
const container = document.getElementById('previewContainer');

uploadInput.addEventListener('change', function(event) {
  const file = event.target.files[0];
  if (!file) return;

  container.innerHTML = '';

  const reader = new FileReader();

  reader.onload = function(e) {
    const img = new Image();
    img.src = e.target.result;

    img.onload = function() {
      for (let i = 1; i <= 10; i++) {
        const quality = i / 10;
        gerarImagem(img, quality, file.name);
      }
    };
  };

  reader.readAsDataURL(file);
});

function gerarImagem(image, quality, originalName) {
  const percent = Math.round(quality * 100);

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  canvas.width = image.width;
  canvas.height = image.height;

  // 🔥 REDUÇÃO FORTE DE RESOLUÇÃO
  const scale = 0.2 + (quality * 0.8); // 20% → 100%
  const tempCanvas = document.createElement('canvas');
  const tempCtx = tempCanvas.getContext('2d');

  tempCanvas.width = canvas.width * scale;
  tempCanvas.height = canvas.height * scale;

  tempCtx.drawImage(image, 0, 0, tempCanvas.width, tempCanvas.height);

  // 🔥 BLUR FORTE
  ctx.filter = `blur(${(1 - quality) * 4}px)`;
  ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
  ctx.filter = 'none';

  // 🔥 ADICIONAR RUÍDO (noise)
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;

  const noiseLevel = (1 - quality) * 50;

  for (let i = 0; i < data.length; i += 4) {
    const noise = (Math.random() - 0.5) * noiseLevel;
    data[i] += noise;     // R
    data[i + 1] += noise; // G
    data[i + 2] += noise; // B
  }

  ctx.putImageData(imageData, 0, 0);

  // COMPRESSÃO FINAL
  const dataUrl = canvas.toDataURL('image/jpeg', quality);

  const nameWithoutExt = originalName.replace(/\.[^/.]+$/, "");
  const fileName = `${nameWithoutExt}_q${percent}.jpg`;

  // UI
  const card = document.createElement('div');
  card.className = 'card';

  const imgEl = document.createElement('img');
  imgEl.src = dataUrl;

  const label = document.createElement('div');
  label.innerText = `Qualidade: ${percent}%`;

  const button = document.createElement('button');
  button.innerText = 'Download';

  button.onclick = function() {
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = fileName;
    link.click();
  };

  card.appendChild(imgEl);
  card.appendChild(label);
  card.appendChild(button);

  container.appendChild(card);
}
</script>

</body>
</html>
